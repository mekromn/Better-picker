name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keep one private debug signing identity for this repository across CI runners.
      # The key itself never lives in git or in the downloadable APK artifact.
      - name: Restore Better Picker signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: better-picker-signing-key-v1

      - name: Create signing key once
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Better Picker CI,O=Mekromn,C=US" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Print signing certificate fingerprint
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA256:'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signer
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BetterPicker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
