name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BETTER_PICKER_CERT_SHA256: 7c92f4984297a336356581d46e1e0674c7117fae800df42257d7823f8998fcaf
      BETTER_PICKER_PACKAGE: com.mekromn.betterpicker
      BETTER_PICKER_VERSION_CODE: '1000000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # One persistent private signing identity for this repository.
      # It lives only in the repository-scoped Actions cache, never in git or APK artifacts.
      - name: Restore Better Picker signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: better-picker-signing-key-v1

      - name: Create signing key once
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Better Picker CI,O=Mekromn,C=US" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify cached signing key identity
        shell: bash
        run: |
          ACTUAL="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/.*SHA256: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          echo "Keystore certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$BETTER_PICKER_CERT_SHA256"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK package and version
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk)"
          echo "$BADGING" | head -n 8
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "APK package: $PACKAGE"
          echo "APK versionCode: $VERSION_CODE"
          test "$PACKAGE" = "$BETTER_PICKER_PACKAGE"
          test "$VERSION_CODE" = "$BETTER_PICKER_VERSION_CODE"

      - name: Verify APK signer identity
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          OUTPUT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          echo "$OUTPUT"
          ACTUAL="$(printf '%s\n' "$OUTPUT" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]')"
          echo "APK certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$BETTER_PICKER_CERT_SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: BetterPicker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
